<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USMS & EMS PANEL v9.6</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:#0b1220;
    color:#e5e7eb;
}

/* TOP NAVBAR */
.topbar{
    height:55px;
    background:#050a14;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #1f2937;
}
.topbar h1{
    font-size:14px;
    color:#38bdf8;
    letter-spacing:2px;
}
.topbar button{
    background:#38bdf8;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

/* LAYOUT */
.container{
    display:flex;
    height:calc(100vh - 55px);
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#0f172a;
    border-right:1px solid #1f2937;
    overflow:auto;
}
.menu-item{
    padding:12px;
    border-bottom:1px solid #1f2937;
    cursor:pointer;
    font-size:13px;
}
.menu-item:hover{
    background:#1f2937;
    color:#38bdf8;
}

/* CONTENT */
.content{
    flex:1;
    padding:20px;
    overflow:auto;
}

.card{
    background:#111827;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #1f2937;
}

.card h2{
    color:#38bdf8;
    font-size:18px;
}

/* PERSONEL */
.personel-card{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}
.p-card{
    background:#0b1220;
    padding:12px;
    border-radius:8px;
    border:1px solid #1f2937;
}
.badge{
    padding:3px 8px;
    border-radius:20px;
    font-size:11px;
}
.admin{background:#2563eb;}
.doktor{background:#16a34a;}
.paramedik{background:#f59e0b;color:black;}
.tek{background:#7c3aed;}

.login{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}
.box{
    background:#111827;
    padding:25px;
    border-radius:10px;
    text-align:center;
}
input{
    padding:10px;
    width:200px;
}
button{
    margin-top:10px;
}
</style>
</head>

<body>

<div class="topbar">
    <h1>USMS EMS CONTROL PANEL</h1>
    <button onclick="toggleMenu()">MENU</button>
</div>

<div id="login" class="login">
    <div class="box">
        <h3>GİRİŞ</h3>
        <input id="pass" type="password" placeholder="şifre">
        <br>
        <button onclick="check()">GİR</button>
    </div>
</div>

<div class="container">

<div id="sidebar" class="sidebar">
    <div class="menu-item" onclick="go('hakkinda')">Hakkında</div>
    <div class="menu-item" onclick="go('personel')">Personel</div>
</div>

<div class="content">

<div id="hakkinda" class="card">
<h2>Hakkında</h2>
USMS EMS panel sistem upgrade v9.6
</div>

<div id="personel" class="card">
<h2>Personel</h2>

<div class="personel-card">

<div class="p-card">
Musa<br>
<span class="badge admin">Admin</span>
</div>

<div class="p-card">
Ahmet<br>
<span class="badge doktor">Doktor</span>
</div>

<div class="p-card">
Mehmet<br>
<span class="badge paramedik">Paramedik</span>
</div>

<div class="p-card">
Ali<br>
<span class="badge tek">Teknik</span>
</div>

</div>
</div>

</div>
</div>

<script>
const correct="musaku32";

function check(){
if(document.getElementById("pass").value===correct){
document.getElementById("login").style.display="none";
}else{
alert("Hatalı şifre");
}
}

function go(id){
document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function toggleMenu(){
let s=document.getElementById("sidebar");
s.style.display=s.style.display==="none"?"block":"none";
}
</script>

</body>
</html>
